[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    # Line length is a formatting concern, not a correctness concern -- normally
    # auto-fixed by `ruff format`, which is intentionally out of scope for P5.
    # The codebase has a prevailing long-line style; enforcing E501 without an
    # auto-formatter would require an unreviewable, repo-wide manual rewrap.
    "E501",
    # `class X(str, Enum)` -> `enum.StrEnum` changes str()/formatting behavior
    # on enums used pervasively in API responses and persistence. Ruff itself
    # classifies this as an unsafe fix. Deferred as a deliberate, separately
    # reviewed change -- not part of a CI-bootstrap PR.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom relies on calling Depends()/Query()/Header()
# as argument defaults; these are not the mutable-default-argument bug B008 exists
# to catch, so they're treated as immutable calls rather than suppressing B008.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy Mapped["ClassName"] relationship() annotations reference sibling
# model classes by string; they're resolved by the ORM mapper registry at
# runtime, not by Python name lookup, so pyflakes' F821 is a false positive here.
"app/models/*.py" = ["F821"]
